name: SwipeClean
options:
  bundleIdPrefix: com.nosleeplab
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_FILE: Sources/SwipeClean/Info.plist
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    # App Store Connect rejects uploads with no version/build. Bump
    # CURRENT_PROJECT_VERSION for every upload of the same MARKETING_VERSION.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SwipeClean:
    type: application
    platform: iOS
    sources:
      - path: Sources/SwipeClean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nosleeplab.SwipeClean
        INFOPLIST_FILE: Sources/SwipeClean/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "SwipeClean needs access to your photo library so you can swipe through photos to keep or delete them."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: true
    dependencies: []

  SwipeCleanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SwipeCleanTests
    dependencies:
      - target: SwipeClean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nosleeplab.SwipeCleanTests
        GENERATE_INFOPLIST_FILE: true

  # Exists to answer the system photo-permission alert, which no simctl command
  # can dismiss. Deliberately kept out of the SwipeClean scheme's test action so
  # `xcodebuild test` stays fast and headless.
  SwipeCleanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/SwipeCleanUITests
    dependencies:
      - target: SwipeClean
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nosleeplab.SwipeCleanUITests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: SwipeClean

schemes:
  # Photo permission grant for the screenshot pipeline. Separate from the main
  # scheme so `xcodebuild test` never launches a UI test.
  SwipeCleanPermission:
    build:
      targets:
        SwipeClean: all
        SwipeCleanUITests: [test]
    test:
      config: Debug
      targets:
        - SwipeCleanUITests

  SwipeClean:
    build:
      targets:
        SwipeClean: all
        SwipeCleanTests: [test]
    run:
      config: Debug
      # Drives the Pro purchase flow locally, so the paywall can be exercised on
      # the simulator without an App Store Connect product.
      storeKitConfiguration: SwipeClean.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SwipeCleanTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
